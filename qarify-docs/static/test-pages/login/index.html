<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Auth Form</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen font-sans p-4">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Login</h2>
                <p class="text-green-600 mt-2">Username: testuser, Password: password123</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username:</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
                    />
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password:</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
                    />
                </div>
                <fieldset>
                    <legend class="sr-only">Buttons</legend>
                    <div class="flex items-center justify-end space-x-4">
                        <button
                            type="reset"
                            class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500"
                        >
                            Reset
                        </button>
                        <button
                            type="submit"
                            class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                        >
                            Submit
                        </button>
                    </div>
                </fieldset>

                <p id="error" class="text-red-500 text-sm text-center"></p>
            </form>
        </div>

        <script>
            // Form submit handler
            document.getElementById('loginForm').addEventListener('submit', function (event) {
                event.preventDefault();
                const errorElement = document.getElementById('error');
                const submitButton = this.querySelector('button[type="submit"]');

                errorElement.innerHTML = '';
                submitButton.disabled = true;
                submitButton.innerHTML = `
                    <svg class="animate-spin h-5 w-5 mr-3 inline-block" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Processing...
                `;

                setTimeout(() => {
                    const username = document.getElementById('username').value;
                    const password = document.getElementById('password').value;
                    if (username === 'testuser' && password === 'password123') {
                        location.href = '/qy-docs/test-pages/login/login-success.html';
                    } else {
                        errorElement.innerHTML = 'Login failed. Please check your credentials.';
                        submitButton.disabled = false;
                        submitButton.innerHTML = 'Submit';
                    }
                }, 1000);
            });
            // reset page on load
            window.addEventListener('load', function () {
                document.getElementById('loginForm').reset();
                const errorElement = document.getElementById('error');
                const submitButton = this.querySelector('button[type="submit"]');
                errorElement.innerHTML = '';
                submitButton.disabled = false;
                submitButton.innerHTML = 'Submit';
            });
        </script>
    </body>
</html>
